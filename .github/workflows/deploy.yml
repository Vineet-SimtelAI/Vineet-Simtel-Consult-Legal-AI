name: 🚀 Deploy ConsultLegal to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger bhi kar sakte ho GitHub UI se

env:
  NODE_VERSION: '20'
  APP_DIR: /home/ubuntu/consultlegal

jobs:
  # ─── JOB 1: Code Quality Check ───────────────────────────────
  lint:
    name: 🔍 Code Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Linter
        run: npm run lint --if-present
        continue-on-error: true  # Lint fail hone pe deploy rok nahi

  # ─── JOB 2: Deploy to Server ─────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: lint  # Pehle lint check hoga
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/cl_dev.pem
          chmod 600 ~/.ssh/cl_dev.pem
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Deploy to Server
        run: |
          ssh -i ~/.ssh/cl_dev.pem ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY'
            set -e  # Koi bhi command fail ho toh ruk jao
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 ConsultLegal Deployment Started"
            echo "⏰ Time: $(date)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            cd /home/ubuntu/consultlegal
            
            # Current commit save karo (rollback ke liye)
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "📌 Previous commit: $PREV_COMMIT"
            
            # Latest code pull karo
            echo "📦 Pulling latest code..."
            git pull origin main
            
            CURR_COMMIT=$(git rev-parse HEAD)
            echo "📌 New commit: $CURR_COMMIT"
            
            # API Build
            echo "🔨 Building API..."
            npm install --prefix apps/api --silent
            cd apps/api && npm run build && cd /home/ubuntu/consultlegal
            
            # Frontend Build
            echo "🔨 Building Frontend..."
            npm install --silent
            npm run build
            
            # Restart Services
            echo "🔄 Restarting services..."
            pm2 restart consultlegal-api --update-env
            pm2 restart consultlegal-web --update-env
            pm2 save
            
            # Wait for services to start
            sleep 5
            
            # Health Check
            echo "❤️ Health Check..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ API Health Check PASSED (HTTP $HTTP_STATUS)"
            else
              echo "❌ API Health Check FAILED (HTTP $HTTP_STATUS)"
              echo "🔙 Rolling back to $PREV_COMMIT..."
              git checkout $PREV_COMMIT
              pm2 restart all
              exit 1
            fi
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment Successful!"
            echo "🌐 App: http://${{ secrets.SERVER_HOST }}:3000"
            echo "⚙️  API: http://${{ secrets.SERVER_HOST }}:4000"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            pm2 list
          DEPLOY

      - name: ✅ Deployment Success Notification
        if: success()
        run: |
          echo "🎉 ConsultLegal successfully deployed!"
          echo "Commit: ${{ github.sha }}"
          echo "By: ${{ github.actor }}"

      - name: ❌ Deployment Failed Notification
        if: failure()
        run: |
          echo "💥 Deployment FAILED!"
          echo "Commit: ${{ github.sha }}"
          echo "Check logs above for details."
