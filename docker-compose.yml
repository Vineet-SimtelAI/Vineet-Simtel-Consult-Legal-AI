version: '3.8'

services:
  # ─── PostgreSQL - Primary Database ───
  postgres:
    image: postgres:16-alpine
    container_name: consultlegal-postgres
    environment:
      POSTGRES_DB: consultlegal
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consultlegal2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d consultlegal"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - consultlegal-network

  # ─── MongoDB - Chat, Documents, Analytics ───
  mongodb:
    image: mongo:7
    container_name: consultlegal-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-consultlegal2024}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - consultlegal-network

  # ─── Redis - Cache, Sessions, Queue ───
  redis:
    image: redis:7-alpine
    container_name: consultlegal-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-consultlegal2024} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-consultlegal2024}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - consultlegal-network

  # ─── MinIO - S3-Compatible File Storage ───
  minio:
    image: minio/minio:latest
    container_name: consultlegal-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - consultlegal-network

  # ─── NestJS API ───
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: consultlegal-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-consultlegal2024}@postgres:5432/consultlegal
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-consultlegal2024}@mongodb:27017/consultlegal?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-consultlegal2024}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: consultlegal
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-consultlegal-jwt-secret-2024}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - consultlegal-network

  # ─── Next.js Web (Frontend + BFF) ───
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consultlegal-web
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-consultlegal-nextauth-secret-2024}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    networks:
      - consultlegal-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:

networks:
  consultlegal-network:
    driver: bridge
